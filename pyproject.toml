[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mozhiflow"
version = "0.1.0"
description = "Multilingual audio and video transcription, translation, and speaker-aware transcripts."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.optional-dependencies]
mlx = ["mlx-whisper"]
vad = ["silero-vad>=6.0,<7"]

[project.scripts]
mozhiflow = "mozhiflow.cli:main"

[project.urls]
Repository = "https://github.com/katpb/mozhiflow"
Issues = "https://github.com/katpb/mozhiflow/issues"

[tool.setuptools]
packages = ["mozhiflow"]
py-modules = ["pipeline", "audio_preprocess", "providers", "sarvam_provider", "ollama_provider", "toolkit_core"]
include-package-data = false
